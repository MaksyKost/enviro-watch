services:
  postgres:
    image: postgres:16-alpine
    container_name: envirowatch-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-envirowatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-envirowatch}
      POSTGRES_DB: ${POSTGRES_DB:-envirowatch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-envirowatch} -d ${POSTGRES_DB:-envirowatch}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: envirowatch-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-envirowatch};Username=${POSTGRES_USER:-envirowatch};Password=${POSTGRES_PASSWORD:-envirowatch}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-characters-long}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
